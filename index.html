<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nối Từ Multiplayer - P2P</title>
    <!-- Thư viện PeerJS -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #4f46e5; margin-bottom: 20px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #4f46e5; }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #4338ca; }
        .btn-green { background: #059669; }
        .btn-green:hover { background: #047857; }
        .hidden { display: none !important; }
        .current-word {
            font-size: 24px;
            font-weight: bold;
            color: #e11d48;
            background: #ffe4e6;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            border: 2px dashed #e11d48;
        }
        .error { color: #dc2626; font-size: 14px; margin-top: 10px; font-weight: bold; }
        .success { color: #059669; font-size: 14px; margin-top: 10px; font-weight: bold; }
        .info-box { background: #f9fafb; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container" id="loginScreen">
        <h2>🎮 Nối Từ Online</h2>
        <div class="info-box">
            👉 <b>Tạo phòng:</b> Nhập tên và mã phòng rồi bấm Tạo.<br>
            👉 <b>Vào phòng:</b> Nhập tên và mã phòng của bạn bè rồi bấm Vào.
        </div>
        <input type="text" id="playerName" placeholder="Nhập tên của bạn..." autocomplete="off">
        <input type="text" id="roomCodeInput" placeholder="Nhập mã phòng (VD: phongabc)..." autocomplete="off">
        <button onclick="createRoom()">Tạo phòng mới (Host)</button>
        <button class="btn-green" onclick="joinRoom()">Vào phòng (Guest)</button>
        <div class="error" id="loginError"></div>
    </div>

    <div class="container hidden" id="roomScreen">
        <h2>Phòng Chờ</h2>
        <p>Mã phòng của bạn:</p>
        <h3 id="displayRoomCode" style="color: #059669; background: #ecfdf5; padding: 10px; border-radius: 8px;"></h3>
        <div id="roomStatus" class="success">Đang chờ người chơi khác kết nối...</div>
    </div>
